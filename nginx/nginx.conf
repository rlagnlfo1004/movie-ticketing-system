worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 65535;
    use epoll;
    multi_accept on;
}

http {
    access_log off;
    sendfile on;
    keepalive_timeout 30s;
    upstream waiting_api {
        least_conn;
        server waiting-api-1:8080;
        server waiting-api-2:8080;
        server waiting-api-3:8080;
        keepalive 100;
    }

    upstream reservation_api {
        server reservation-api:8081;
        keepalive 32;
    }

    server {
        listen 80 reuseport;

        location = /nginx_status {
            stub_status;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;
        }

        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        location = /demo {
            rewrite ^ /demo/index.html last;
        }

        location = /demo/ {
            rewrite ^ /demo/index.html last;
        }

        location /demo/ {
            proxy_set_header Host $host;
            proxy_pass http://reservation_api;
        }

        location ~ ^/api/v1/screenings/[^/]+/(holds|seats|reservations/me)$ {
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_pass http://reservation_api;
        }

        location /api/v1/payments/ {
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_pass http://reservation_api;
        }

        location = /api/v1/webhooks/portone {
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_pass http://reservation_api;
        }

        location /api/v1/screenings/ {
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_pass http://waiting_api;
        }
    }
}
