server:
  port: 8084

spring:
  application:
    name: reservation-worker
  datasource:
    url: jdbc:mysql://localhost:3306/movie_seats?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${SPRING_DATASOURCE_USERNAME:movie}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    redis:
      host: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

worker:
  test-write-pause: 0ms
  reclaim-min-idle: 30s
