x-common: &common
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"
  ulimits:
    nofile:
      soft: 65535
      hard: 65535

services:
  redis:
    <<: *common
    image: redis:7.2-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./infra/tuning/redis-v1.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"

  mysql:
    <<: *common
    image: mysql:8.4
    volumes:
      - ./infra/tuning/mysql.cnf:/etc/mysql/conf.d/tuning.cnf:ro
    environment:
      MYSQL_DATABASE: movie_seats
      MYSQL_USER: movie
      MYSQL_PASSWORD: movie
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysql -h localhost -umovie -pmovie -e 'SELECT 1' movie_kim"]
      interval: 5s
      timeout: 3s
      retries: 20

  waiting-api-1:
    <<: *common
    image: eclipse-temurin:21-jre
    env_file: ./infra/tuning/jvm.env
    working_dir: /app
    volumes:
      - ./waiting-api/build/libs:/app
    command: ["java", "-jar", "/app/waiting-api-0.0.1-SNAPSHOT.jar"]
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SERVER_PORT: 8080
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
      SPRING_DATA_REDIS_LETTUCE_POOL_ENABLED: "true"
      SPRING_DATA_REDIS_LETTUCE_POOL_MAX_ACTIVE: 200
      SPRING_DATA_REDIS_LETTUCE_POOL_MAX_IDLE: 100
      SPRING_DATA_REDIS_LETTUCE_POOL_MIN_IDLE: 50
      WAITING_QUEUE_ADMISSION_SCHEDULER_INTERVAL: 1000
      WAITING_QUEUE_ADMISSION_BATCH_SIZE: 300
      WAITING_QUEUE_ADMISSION_MAX_ACTIVE_USERS: 1000
      WAITING_QUEUE_ADMISSION_LOCK_TTL: 5s
    depends_on:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  waiting-api-2:
    <<: *common
    image: eclipse-temurin:21-jre
    env_file: ./infra/tuning/jvm.env
    working_dir: /app
    volumes:
      - ./waiting-api/build/libs:/app
    command: ["java", "-jar", "/app/waiting-api-0.0.1-SNAPSHOT.jar"]
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SERVER_PORT: 8080
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
      SPRING_DATA_REDIS_LETTUCE_POOL_ENABLED: "true"
      SPRING_DATA_REDIS_LETTUCE_POOL_MAX_ACTIVE: 200
      SPRING_DATA_REDIS_LETTUCE_POOL_MAX_IDLE: 100
      SPRING_DATA_REDIS_LETTUCE_POOL_MIN_IDLE: 50
      WAITING_QUEUE_ADMISSION_SCHEDULER_INTERVAL: 1000
      WAITING_QUEUE_ADMISSION_BATCH_SIZE: 300
      WAITING_QUEUE_ADMISSION_MAX_ACTIVE_USERS: 1000
      WAITING_QUEUE_ADMISSION_LOCK_TTL: 5s
    depends_on:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  waiting-api-3:
    <<: *common
    image: eclipse-temurin:21-jre
    env_file: ./infra/tuning/jvm.env
    working_dir: /app
    volumes:
      - ./waiting-api/build/libs:/app
    command: ["java", "-jar", "/app/waiting-api-0.0.1-SNAPSHOT.jar"]
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SERVER_PORT: 8080
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
      SPRING_DATA_REDIS_LETTUCE_POOL_ENABLED: "true"
      SPRING_DATA_REDIS_LETTUCE_POOL_MAX_ACTIVE: 200
      SPRING_DATA_REDIS_LETTUCE_POOL_MAX_IDLE: 100
      SPRING_DATA_REDIS_LETTUCE_POOL_MIN_IDLE: 50
      WAITING_QUEUE_ADMISSION_SCHEDULER_INTERVAL: 1000
      WAITING_QUEUE_ADMISSION_BATCH_SIZE: 300
      WAITING_QUEUE_ADMISSION_MAX_ACTIVE_USERS: 1000
      WAITING_QUEUE_ADMISSION_LOCK_TTL: 5s
    depends_on:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  reservation-api:
    <<: *common
    image: eclipse-temurin:21-jre
    env_file: ./infra/tuning/jvm.env
    working_dir: /app
    volumes:
      - ./reservation-api/build/libs:/app
    command: ["java", "-jar", "/app/reservation-api-0.0.1-SNAPSHOT.jar"]
    environment:
      SERVER_PORT: 8081
      SPRING_DATA_REDIS_HOST: redis
      RESERVATION_ACTIVE_ADMISSION_BASE_URL: http://waiting-api-1:8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/movie_seats?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: movie
      SPRING_DATASOURCE_PASSWORD: movie
      RESERVATION_MOCK_PG_BASE_URL: http://mock-pg:8082
      RESERVATION_WEBHOOK_SECRET: whsec_bW9jay13ZWJob29rLXNlY3JldA==
      RESERVATION_V1_LOCK_PAUSE: ${V1_LOCK_PAUSE:-0ms}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 100
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 20
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: 3000
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
    depends_on:
      redis:
        condition: service_started
      mysql:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/8081 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  storage:
    <<: *common
    image: alpine:3.20
    command: ["sh", "-c", "sleep infinity"]

  nginx:
    <<: *common
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      waiting-api-1:
        condition: service_healthy
      waiting-api-2:
        condition: service_healthy
      waiting-api-3:
        condition: service_healthy
      reservation-api:
        condition: service_healthy
    ports:
      - "8000:80"

  mock-pg:
    <<: *common
    build:
      context: .
      dockerfile: load-test/mock-pg.Dockerfile
    environment:
      PORT: 8082
      MOCK_PG_API_SECRET: mock-api-secret
      MOCK_PG_WEBHOOK_SECRET: whsec_bW9jay13ZWJob29rLXNlY3JldA==
      MOCK_PG_STORE_ID: store-mock
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8082/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  harness-stub:
    <<: *common
    image: node:22-alpine
    profiles: ["harness-smoke"]
    volumes:
      - ./load-test/harness-smoke-stub.mjs:/app/stub.mjs:ro
    command: ["node", "/app/stub.mjs"]
    environment:
      PORT: 18080

  k6:
    <<: *common
    image: grafana/k6
    profiles: ["load-test"]
    volumes:
      - ./load-test:/load-test
    environment:
      BASE_URL: http://nginx
      MOCK_PG_URL: http://mock-pg:8082
      WEBHOOK_URL: http://reservation-api:8081/api/v1/webhooks/portone
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(95),p(99),avg
      SCREENING_ID: ${SCREENING_ID:-1}
    depends_on:
      - nginx
      - mock-pg
    networks:
      - default

  prometheus:
    <<: *common
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--web.enable-remote-write-receiver"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    <<: *common
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: local-grafana
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - renderer

  renderer:
    <<: *common
    image: grafana/grafana-image-renderer:3.11.6
    environment:
      ENABLE_METRICS: "true"

  node-exporter:
    <<: *common
    image: prom/node-exporter:v1.9.1
    command: ["--path.procfs=/host/proc", "--path.sysfs=/host/sys", "--path.rootfs=/host/root"]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro

  mysqld-exporter:
    <<: *common
    image: prom/mysqld-exporter:v0.17.2
    command: ["--config.my-cnf=/etc/mysql-exporter.cnf", "--collect.info_schema.innodb_metrics", "--collect.perf_schema.eventsstatements"]
    volumes:
      - ./observability/mysql-exporter.cnf:/etc/mysql-exporter.cnf:ro
    depends_on:
      mysql:
        condition: service_healthy

  redis-exporter:
    <<: *common
    image: oliver006/redis_exporter:v1.76.0
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_EXPORTER_INCL_SYSTEM_METRICS: "true"
      REDIS_EXPORTER_IS_TILE38: "false"
      REDIS_EXPORTER_CHECK_STREAMS: "stream:*:reservations*"
    depends_on:
      - redis

  nginx-exporter:
    <<: *common
    image: nginx/nginx-prometheus-exporter:1.4.2
    command: ["--nginx.scrape-uri=http://nginx/nginx_status"]
    depends_on:
      - nginx
