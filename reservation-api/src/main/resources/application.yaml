server:
  port: 8081

spring:
  application:
    name: reservation-api
  datasource:
    url: jdbc:mysql://localhost:3306/movie_seats?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: movie
    password: movie
  sql:
    init:
      mode: always
  data:
    redis:
      host: localhost
      port: 6379

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

reservation:
  hold-duration: 30s
  mock-pg-base-url: http://localhost:8082
  mock-pg-api-secret: mock-api-secret
  active-admission:
    base-url: http://localhost:8080
  idempotency:
    ttl: 10m
  queue-token-pattern: "^[A-Za-z0-9._:-]{8,256}$"
  idempotency-key-pattern: "^[A-Za-z0-9._:-]{8,128}$"

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
