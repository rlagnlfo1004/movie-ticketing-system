global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: waiting-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [waiting-api-1:8080, waiting-api-2:8080, waiting-api-3:8080]
  - job_name: reservation-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [reservation-api:8081]
  - job_name: mysql
    static_configs:
      - targets: [mysqld-exporter:9104]
  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]
  - job_name: nginx
    static_configs:
      - targets: [nginx-exporter:9113]
  - job_name: node
    static_configs:
      - targets: [node-exporter:9100]
